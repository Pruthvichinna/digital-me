<!doctype html>
<html lang="en" data-mode="presentation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232748E8'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='36' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-body:"Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
/* Presentation: daylight, cool, professional */
html[data-mode="presentation"]{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#151A24; --muted:#5B6475; --line:#DCE1E9;
  --accent:#2748E8; --accent-ink:#FFFFFF; --user:#E4EAFF; --user-ink:#151A24; --danger:#B3261E;
}
/* Companion: evening, quiet, lamp-lit */
html[data-mode="companion"]{
  --bg:#1B1830; --panel:#252142; --ink:#F4EEE6; --muted:#ABA5C6; --line:#3A3560;
  --accent:#F0B35E; --accent-ink:#2A1D05; --user:#38325E; --user-ink:#F4EEE6; --danger:#FF9C8F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease,color .5s ease;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:288px 1fr;height:100dvh}

/* ---------- sidebar ---------- */
.side{
  background:var(--panel); border-right:1px solid var(--line);
  padding:24px 18px; display:flex; flex-direction:column; gap:22px;
  transition:background-color .5s ease,border-color .5s ease;
}
.id{display:flex;align-items:center;gap:12px}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:19px;
  transition:background-color .5s ease,color .5s ease;
}
.name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.who{color:var(--muted);font-size:13px}
.newchat{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;cursor:pointer;
  transition:border-color .2s ease;
}
.newchat:hover{border-color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:10px}
.room{
  text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
  transition:border-color .2s ease,background-color .2s ease;
}
.room:hover{border-color:var(--muted)}
.room[aria-pressed="true"]{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,transparent);
}
.room-title{font-family:var(--font-display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.room-desc{color:var(--muted);font-size:13.5px;line-height:1.4}
.lock{width:14px;height:14px;opacity:.7}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow-y:auto;padding:40px 24px 24px}
.thread{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

.empty{padding-top:6vh}
.empty h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-.025em;margin:0 0 14px;
}
.empty p{color:var(--muted);font-size:18px;line-height:1.5;max-width:32em;margin:0 0 28px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip-btn{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;cursor:pointer;font-size:15px;text-align:left;
  transition:border-color .2s ease;
}
.chip-btn:hover{border-color:var(--accent)}
.fine{color:var(--muted);font-size:13.5px;margin:22px 0 0;max-width:36em}

.msg{display:flex;gap:14px}
.msg.user{justify-content:flex-end}
.bubble{
  background:var(--user);color:var(--user-ink);
  padding:11px 16px;border-radius:18px 18px 4px 18px;max-width:80%;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.av{
  width:30px;height:30px;border-radius:50%;flex:none;margin-top:2px;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;
}
.body{min-width:0;flex:1}
.prose{font-size:16.5px;line-height:1.65;overflow-wrap:anywhere}
.prose p{margin:0 0 .8em}
.prose p:last-child,.prose ul:last-child,.prose ol:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 .8em;padding-left:1.3em}
.prose li{margin:.25em 0}
.prose code{background:var(--line);border-radius:5px;padding:.1em .35em;font-size:.92em}
.sources{
  margin-top:10px;color:var(--muted);font-size:13px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  opacity:0;transition:opacity .3s ease;
}
.sources.shown{opacity:1}
.src{border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.errbox{
  border:1px solid var(--danger);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.errbox button{
  background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;
}
.errbox button:hover{border-color:var(--muted)}

/* ---------- unlock ---------- */
.unlock{max-width:440px;padding-top:8vh}
.unlock h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4.5vw,42px);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.unlock p{color:var(--muted);margin:0 0 20px}
.unlock form{display:flex;gap:10px}
.unlock input{
  flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
}
.unlock input:focus{outline:none;border-color:var(--accent)}
.unlock .go{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
  padding:0 20px;font-weight:600;cursor:pointer;
}
.unlock .go:disabled{opacity:.5;cursor:wait}
.unlock .bad{color:var(--danger);margin:12px 0 0;font-size:14.5px}

/* ---------- composer ---------- */
.composer-wrap{padding:0 24px 18px}
.composer{max-width:720px;margin:0 auto}
.box{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--panel);border:1.5px solid var(--line);border-radius:24px;
  padding:10px 10px 10px 20px;transition:border-color .2s ease,background-color .5s ease;
}
.box:focus-within{border-color:var(--accent)}
.box textarea{
  flex:1;border:0;background:transparent;resize:none;outline:none;
  max-height:200px;padding:8px 0;line-height:1.5;
}
.box textarea::placeholder{color:var(--muted)}
.send{
  width:40px;height:40px;border-radius:50%;border:0;flex:none;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  transition:opacity .2s ease;
}
.send:disabled{opacity:.35;cursor:not-allowed}
.note{color:var(--muted);font-size:12.5px;text-align:center;margin:10px 0 0}
[hidden]{display:none !important}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}
  .id{flex:1}
  .who{display:none}
  .rooms{flex-direction:row;width:100%;order:3}
  .room{flex:1;padding:10px 12px}
  .room-desc{display:none}
  .newchat{padding:8px 12px}
  .scroll{padding:24px 16px 16px}
  .composer-wrap{padding:0 12px 12px}
  .bubble{max-width:90%}
  .empty{padding-top:2vh}
  .empty p{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="id">
      <div class="avatar" aria-hidden="true">P</div>
      <div>
        <div class="name">Digital Me</div>
        <div class="who">AI version of Pruthvi</div>
      </div>
    </div>
    <button class="newchat" id="newchat" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      New chat
    </button>
    <div class="rooms" role="group" aria-label="Mode">
      <button class="room" type="button" data-mode="presentation" aria-pressed="true">
        <span class="room-title">Presentation</span>
        <span class="room-desc">Talk to me about my work and background.</span>
      </button>
      <button class="room" type="button" data-mode="companion" aria-pressed="false">
        <span class="room-title">Companion
          <svg class="lock" id="lockicon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
        </span>
        <span class="room-desc">Private. Me talking to me when things feel heavy.</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="scroll" id="scroll">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
    <div class="composer-wrap" id="composerwrap">
      <form class="composer" id="composer" autocomplete="off">
        <div class="box">
          <textarea id="input" rows="1" maxlength="2000" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5"/></svg>
          </button>
        </div>
        <p class="note" id="note"></p>
      </form>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const thread = $("#thread"), scroller = $("#scroll"), input = $("#input"),
        sendBtn = $("#send"), composer = $("#composer"), composerWrap = $("#composerwrap"),
        note = $("#note"), lockIcon = $("#lockicon");

  const MODES = {
    presentation: {
      title: "Hi, I'm Pruthvi.",
      sub: "Well, an AI version of me. Ask about my work, my projects, and what I'm learning.",
      placeholder: "Ask me about my work",
      prompts: [
        "What do you work on day to day?",
        "Where are you headed in your career?",
        "What's your background?",
        "How do you like to work?"
      ],
      fine: "",
      note: "You're talking to an AI version of Pruthvi. It answers from his notes and can be wrong.",
      sources: "From my notes"
    },
    companion: {
      title: "Hey. How are you doing?",
      sub: "This space is just for you. Tell me what's going on.",
      placeholder: "Say what's on your mind",
      prompts: [
        "I feel like I'm not learning fast enough",
        "I'm stuck and overwhelmed",
        "I need a reset"
      ],
      fine: "This app doesn't save these chats. Replies are written by an outside language model service.",
      note: "AI, not a therapist. If you might hurt yourself, contact local emergency services or a crisis line now.",
      sources: "From your notes"
    }
  };

  /* ---------- storage (key lives in this tab only) ---------- */
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };

  const state = {
    mode: "presentation",
    key: store.get("dm_key") || "",
    history: { presentation: [], companion: [] },
    busy: { presentation: false, companion: false },
    nextId: 1
  };
  let finishReveal = null;
  let unlockError = "";

  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isLocked = () => state.mode === "companion" && !state.key;

  /* ---------- safe mini markdown ---------- */
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const inline = s => {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    return s;
  };
  function md(src) {
    const lines = src.replace(/\r/g, "").split("\n");
    let html = "", list = null, para = [];
    const flush = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
    const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
    for (const line of lines) {
      let m;
      if (!line.trim()) { flush(); close(); continue; }
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
        flush(); if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
        html += "<li>" + inline(m[1]) + "</li>"; continue;
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
        flush(); if (list !== "ol") { close(); html += "<ol>"; list = "ol"; }
        html += "<li>" + inline(m[1]) + "</li>"; continue;
      }
      if ((m = line.match(/^#{1,6}\s+(.*)/))) {
        flush(); close(); html += "<p><strong>" + inline(m[1]) + "</strong></p>"; continue;
      }
      close(); para.push(line);
    }
    flush(); close();
    return html;
  }

  /* ---------- building blocks ---------- */
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function buildMessage(m) {
    const row = el("div", "msg " + (m.role === "user" ? "user" : "bot"));
    row.dataset.id = m.id;
    if (m.role === "user") {
      row.appendChild(el("div", "bubble", m.content));
      return row;
    }
    row.appendChild(el("div", "av", "P")).setAttribute("aria-hidden", "true");
    const body = el("div", "body");
    if (m.status === "pending") {
      const d = el("span", "dots");
      d.setAttribute("role", "status");
      d.setAttribute("aria-label", "Thinking");
      d.innerHTML = "<i></i><i></i><i></i>";
      body.appendChild(d);
    } else if (m.status === "error") {
      const box = el("div", "errbox");
      box.appendChild(el("div", "", m.content));
      const b = el("button", "", "Try again");
      b.type = "button";
      b.addEventListener("click", () => retry(m));
      box.appendChild(b);
      body.appendChild(box);
    } else {
      const prose = el("div", "prose");
      prose.innerHTML = md(m.content);
      body.appendChild(prose);
      if (m.sources && m.sources.length) {
        const s = el("div", "sources");
        s.appendChild(el("span", "", MODES[state.mode].sources));
        m.sources.forEach(n => s.appendChild(el("span", "src", n)));
        body.appendChild(s);
      }
    }
    row.appendChild(body);
    return row;
  }

  function buildEmpty() {
    const cfg = MODES[state.mode];
    const wrap = el("div", "empty");
    wrap.appendChild(el("h1", "", cfg.title));
    wrap.appendChild(el("p", "", cfg.sub));
    const chips = el("div", "chips");
    cfg.prompts.forEach(p => {
      const b = el("button", "chip-btn", p);
      b.type = "button";
      b.addEventListener("click", () => send(p));
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    if (cfg.fine) wrap.appendChild(el("p", "fine", cfg.fine));
    return wrap;
  }

  function buildUnlock() {
    const wrap = el("div", "unlock");
    wrap.appendChild(el("h1", "", "Companion is private"));
    wrap.appendChild(el("p", "", "Enter your access key to continue. It's the COMPANION_API_KEY value in backend/.env, and it stays in this browser tab only."));
    const form = el("form");
    const field = el("input");
    field.type = "password"; field.placeholder = "Access key";
    field.setAttribute("aria-label", "Access key"); field.autocomplete = "off";
    const go = el("button", "go", "Unlock");
    go.type = "submit";
    form.append(field, go);
    wrap.appendChild(form);
    const bad = el("p", "bad", unlockError);
    bad.hidden = !unlockError;
    wrap.appendChild(bad);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const val = field.value.trim();
      if (!val) return;
      go.disabled = true; go.textContent = "Checking";
      try {
        const r = await fetch("/companion/check", { headers: { "X-API-Key": val } });
        if (r.ok) {
          state.key = val; store.set("dm_key", val); unlockError = "";
          render(); input.focus();
          return;
        }
        unlockError = "That key didn't match. Check COMPANION_API_KEY in backend/.env.";
      } catch (err) {
        unlockError = "Can't reach the Digital Me server. Make sure uvicorn is still running.";
      }
      bad.textContent = unlockError; bad.hidden = false;
      go.disabled = false; go.textContent = "Unlock";
      field.focus(); field.select();
    });
    setTimeout(() => field.focus(), 0);
    return wrap;
  }

  /* ---------- rendering ---------- */
  function toBottom() { scroller.scrollTop = scroller.scrollHeight; }
  const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;

  function render() {
    const cfg = MODES[state.mode];
    document.documentElement.dataset.mode = state.mode;
    document.querySelectorAll(".room").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    lockIcon.style.display = state.key ? "none" : "";
    input.placeholder = cfg.placeholder;
    note.textContent = cfg.note;

    thread.textContent = "";
    if (isLocked()) {
      composerWrap.hidden = true;
      thread.appendChild(buildUnlock());
      return;
    }
    composerWrap.hidden = false;
    const hist = state.history[state.mode];
    if (!hist.length) thread.appendChild(buildEmpty());
    else hist.forEach(m => thread.appendChild(buildMessage(m)));
    updateSend();
    toBottom();
  }

  function updateSend() {
    sendBtn.disabled = state.busy[state.mode] || !input.value.trim();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  /* ---------- typewriter reveal (walks text nodes, so markdown never flickers) ---------- */
  function reveal(root, onDone) {
    if (reduceMotion()) { onDone(); return; }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; let n;
    while ((n = walker.nextNode())) nodes.push({ node: n, full: n.nodeValue });
    const total = nodes.reduce((a, b) => a + b.full.length, 0);
    nodes.forEach(o => { o.node.nodeValue = ""; });
    const per = Math.max(2, Math.ceil(total / 200));
    let i = 0, pos = 0, done = false;
    const finish = () => {
      if (done) return; done = true;
      nodes.forEach(o => { o.node.nodeValue = o.full; });
      finishReveal = null; onDone();
    };
    finishReveal = finish;
    (function tick() {
      if (done) return;
      const follow = nearBottom();
      let budget = per;
      while (budget > 0 && i < nodes.length) {
        const o = nodes[i];
        const take = Math.min(budget, o.full.length - pos);
        pos += take; budget -= take;
        o.node.nodeValue = o.full.slice(0, pos);
        if (pos >= o.full.length) { i++; pos = 0; }
      }
      if (follow) toBottom();
      if (i >= nodes.length) { finish(); return; }
      requestAnimationFrame(tick);
    })();
  }

  /* ---------- talking to the backend ---------- */
  function friendlyError(status, detail) {
    if (status === 422) return "That message couldn't be sent. Try a shorter one.";
    if (status === 429) return "That's too many questions in a minute. Wait a moment and try again.";
    if (status === 502 || status === 500) return detail || "The server hit an error. Check the uvicorn terminal for details.";
    return detail || ("Something went wrong (error " + status + ").");
  }

  function replaceMessage(mode, id, next) {
    const list = state.history[mode];
    const idx = list.findIndex(m => m.id === id);
    if (idx === -1) return;
    list[idx] = next;
    if (state.mode !== mode || isLocked()) return;
    const old = thread.querySelector('[data-id="' + id + '"]');
    if (!old) return;
    const fresh = buildMessage(next);
    old.replaceWith(fresh);
    const prose = fresh.querySelector(".prose");
    const src = fresh.querySelector(".sources");
    if (prose) {
      reveal(prose, () => { if (src) src.classList.add("shown"); });
    }
    toBottom();
  }

  async function send(text) {
    text = (text || "").trim();
    const mode = state.mode;
    if (!text || state.busy[mode] || (mode === "companion" && !state.key)) return;
    if (finishReveal) finishReveal();

    const hist = state.history[mode];
    const prior = hist.filter(m => m.status === "done").map(m => ({ role: m.role, content: m.content }));
    const userMsg = { id: state.nextId++, role: "user", content: text, status: "done" };
    const pending = { id: state.nextId++, role: "assistant", content: "", status: "pending" };
    hist.push(userMsg, pending);
    state.busy[mode] = true;
    input.value = ""; autosize();
    render();

    const headers = { "Content-Type": "application/json" };
    if (mode === "companion") headers["X-API-Key"] = state.key;
    let next;
    try {
      const r = await fetch("/chat", {
        method: "POST", headers,
        body: JSON.stringify({ mode, message: text, history: prior })
      });
      let data = {};
      try { data = await r.json(); } catch (e) {}
      if (r.ok) {
        next = { id: pending.id, role: "assistant", content: data.answer || "", sources: data.sources || [], status: "done" };
      } else if (r.status === 401 && mode === "companion") {
        state.key = ""; store.del("dm_key");
        unlockError = "Your access key was rejected. Enter it again.";
        state.history.companion = [];
        state.busy[mode] = false;
        render();
        return;
      } else {
        const detail = typeof data.detail === "string" ? data.detail : "";
        next = { id: pending.id, role: "assistant", status: "error", retryText: text, userId: userMsg.id,
                 content: friendlyError(r.status, detail) };
      }
    } catch (e) {
      next = { id: pending.id, role: "assistant", status: "error", retryText: text, userId: userMsg.id,
               content: "Can't reach the Digital Me server. Make sure uvicorn is still running in your terminal." };
    }
    state.busy[mode] = false;
    replaceMessage(mode, pending.id, next);
    updateSend();
  }

  function retry(m) {
    const list = state.history[state.mode];
    state.history[state.mode] = list.filter(x => x.id !== m.id && x.id !== m.userId);
    render();
    send(m.retryText);
  }

  /* ---------- events ---------- */
  composer.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
  input.addEventListener("input", () => { autosize(); updateSend(); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });

  document.querySelectorAll(".room").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.mode === state.mode) return;
    if (finishReveal) finishReveal();
    state.mode = b.dataset.mode;
    unlockError = "";
    render();
    if (!isLocked()) input.focus();
  }));

  $("#newchat").addEventListener("click", () => {
    if (finishReveal) finishReveal();
    state.history[state.mode] = [];
    render();
    if (!isLocked()) input.focus();
  });

  render();
  input.focus();
})();
</script>
</body>
</html>
